<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自己紹介</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <body class="bg-orange-800 bg-opacity-10 max-w-full mx-auto">
        <main class="text-2xl font-bold text-gray-900 m-20 text-center">自己紹介</main>
        <div class="flex flex-col md:flex-row justify-center items-center gap-12 mt-6 w-full overflow-hidden">
            <div class="flex flex-col justify-around items-center rounded-lg overflow-hidden gap-0 shadow-lg hover:scale-105 bg-white">
                <h1 class="bg-blue-500 bg-opacity-90 text-4xl px-44 py-4 pb-4">🤪
                <h2 class="text-lg font-bold text-gray-900 pt-4 px-44 hover:text-blue-500">カノン</h2>
                <p class="text-gray-600 text-sm pt-4 px-4 text-center">お姉ちゃんのことが大好きで、いつも「あやちゃーん」と呼びかける。</p>
                <p class="text-gray-600 text-sm text-center">観察力が高く、姉の取り扱い方を一番わかっている。</p>
                <p class="text-gray-600 text-sm pb-4 text-center">大人っぽい顔立ちで、よく大学生に間違えられる。</p>
            </div>
            <div class="flex flex-col justify-around items-center rounded-lg overflow-hidden gap-0 shadow-lg hover:scale-105 bg-white">
                <h1 class="bg-blue-500 bg-opacity-90 text-4xl px-44 py-4 pb-4">🤓
                <h2 class="text-lg font-bold text-gray-900 bg-white pt-4 hover:text-blue-500">タダシ</h2>
                <p class="text-gray-600 text-sm pt-4 px-4 text-center">何だかんだ、いつも家族のことばかり考えている。</p>
                <p class="text-gray-600 text-sm text-center">一度決めたら、目標を達成するまで努力を惜しまない。</p>
                <p class="text-gray-600 text-sm pb-4 text-center">表には出さないが、意外と寂しがり屋。</p>
            </div>
            <div class="flex flex-col justify-around items-center rounded-lg overflow-hidden gap-0 shadow-lg hover:scale-105 bg-white">
                <h1 class="bg-blue-500 bg-opacity-90 text-4xl px-44 py-4 pb-4">😍
                <h2 class="text-lg font-bold text-gray-900 bg-white pt-4 hover:text-blue-500">セイコ</h2>
                <p class="text-gray-600 text-sm pt-4 px-4 text-center">傾聴力が高く、周りからよく相談を受けがち。</p>
                <p class="text-gray-600 text-sm text-center">娘からの相談もよく引き受けている。娘の一番の理解者。</p>
                <p class="text-gray-600 text-sm pb-4 text-center">心配性で、いつも娘に「起きてる？」と確認の連絡をする。</p>
            </div>
        </div>
    </body>
</body>
